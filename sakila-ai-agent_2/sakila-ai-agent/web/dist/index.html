<title>Sakila Category Journeys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#f6f7f9; --surface:#ffffff; --sunken:#eef0f3; --rule:#e1e4e9; --rule-strong:#cfd4db;
  --ink:#13161b; --ink-2:#4f5663; --ink-3:#7c8492;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e8f1fc;
  --s1:#2a78d6; --s2:#eb6834; --s-gray:#9aa1ac;
  --caution-bg:#fdf1ea; --caution-rule:#eb6834; --finding-bg:#ecf3fd; --neutral-bg:#f0f2f5;
  --heat-0:#f3f7fd; --heat-1:#cde2fb; --heat-2:#86b6ef; --heat-3:#2a78d6; --heat-4:#104281;
  --div-lo:#1c5cab; --div-mid:#eceae6; --div-hi:#c0392f;
  --shadow:0 1px 2px rgba(19,22,27,.05),0 2px 8px rgba(19,22,27,.04);
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0f1216; --surface:#171b21; --sunken:#1d2229; --rule:#2a3038; --rule-strong:#3a414b;
    --ink:#eef1f5; --ink-2:#b6bdc8; --ink-3:#8a93a0;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b2a3e;
    --s1:#3987e5; --s2:#d95926; --s-gray:#6b7380;
    --caution-bg:#2b1d16; --caution-rule:#d95926; --finding-bg:#15243a; --neutral-bg:#1d2229;
    --heat-0:#1a2230; --heat-1:#1c3a63; --heat-2:#2a63ad; --heat-3:#5598e7; --heat-4:#b7d3f6;
    --div-lo:#5598e7; --div-mid:#2a3038; --div-hi:#e66767;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1216; --surface:#171b21; --sunken:#1d2229; --rule:#2a3038; --rule-strong:#3a414b;
  --ink:#eef1f5; --ink-2:#b6bdc8; --ink-3:#8a93a0;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1b2a3e;
  --s1:#3987e5; --s2:#d95926; --s-gray:#6b7380;
  --caution-bg:#2b1d16; --caution-rule:#d95926; --finding-bg:#15243a; --neutral-bg:#1d2229;
  --heat-0:#1a2230; --heat-1:#1c3a63; --heat-2:#2a63ad; --heat-3:#5598e7; --heat-4:#b7d3f6;
  --div-lo:#5598e7; --div-mid:#2a3038; --div-hi:#e66767;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:1180px;margin:0 auto;padding-inline:20px;display:flex;align-items:center;gap:20px;min-height:58px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.reel{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--ground) 0 2.5px,transparent 3px),conic-gradient(var(--accent) 0 12.5%,var(--ink) 0 25%,var(--accent) 0 37.5%,var(--ink) 0 50%,var(--accent) 0 62.5%,var(--ink) 0 75%,var(--accent) 0 87.5%,var(--ink) 0)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--ink-2);text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;display:flex;gap:7px;align-items:center}
nav.tabs a .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--rule-strong);border-radius:5px;padding:0 5px;line-height:17px}
nav.tabs a:hover{background:var(--sunken);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs a[aria-current="page"] .n{border-color:var(--accent);color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
section.page{display:flex;flex-direction:column;gap:22px}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1;margin:4px 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:10px 0 0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 6px;color:var(--ink)}
.lede{color:var(--ink-2);max-width:72ch;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 16px 10px;box-shadow:var(--shadow);min-width:0}
.panel .sub{font-size:12.5px;color:var(--ink-3);margin:-2px 0 8px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.note{border-radius:10px;padding:12px 16px;font-size:14.5px;line-height:1.55;border-left:3px solid var(--accent);background:var(--finding-bg);max-width:none}
.note.caution{border-left-color:var(--caution-rule);background:var(--caution-bg)}
.note.neutral{border-left-color:var(--s-gray);background:var(--neutral-bg)}
.note b.tag{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.story a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.story a:hover{border-color:var(--accent)}
.story .n{font-family:var(--mono);font-size:11px;color:var(--accent)}
.story .q{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.3}
.story .a{font-size:13px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--rule-strong);background:var(--surface);white-space:nowrap}
.chip.last{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips .arr{color:var(--ink-3);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600}
select,input[type=number],input[type=text],textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;padding:7px 10px}
.seg{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink-2);padding:6px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;cursor:pointer;padding-bottom:6px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--sunken);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tr:last-child td{border-bottom:0}
.movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
#rview,#jview{display:flex;flex-direction:column;gap:16px}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-family:var(--mono);margin:4px 0 6px 92px;flex-wrap:wrap}
.scale .bar{width:180px;max-width:40vw;height:10px;border-radius:3px;border:1px solid var(--rule)}

.movie::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:repeating-linear-gradient(to bottom,var(--ink) 0 5px,transparent 5px 10px);opacity:.14}
.movie .rank{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.movie .t{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2;text-transform:capitalize}
.movie .m{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:11px;border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px}
details{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
pre.sql{font-family:var(--mono);font-size:12px;line-height:1.5;background:var(--sunken);border-radius:8px;padding:12px;overflow-x:auto;margin:10px 0 4px;color:var(--ink)}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 4px 16px rgba(0,0,0,.14);max-width:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed var(--s-gray);border-radius:0;width:14px;vertical-align:3px}
/* chat */
.chat{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;min-height:360px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .who{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600}
.msg.user .who{background:var(--sunken);color:var(--ink-2)}
.msg.bot .who{background:var(--accent);color:var(--accent-ink)}
.msg .body{min-width:0;flex:1;font-size:14.5px}
.msg.user .body{font-weight:600}
.msg .body p{margin:0 0 8px}
.msg .body table{margin:6px 0 10px;font-size:13px}
.msg .body .tablewrap{margin:6px 0 10px}
.msg .body ul{margin:4px 0 8px;padding-left:20px}
.toolrun{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;margin:6px 0}
.toolrun details{padding:6px 10px;border-radius:8px;background:var(--sunken);border:0}
.toolrun summary{font-weight:500;font-size:11.5px}
.toolrun pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;margin:6px 0 0;font-size:11px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:46px;max-height:160px}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.examples button{font:inherit;font-size:13px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;text-align:left}
.examples button:hover{border-color:var(--accent);color:var(--accent)}
.status{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s-gray)}
.dot.on{background:#1baf7a}
.thinking{color:var(--ink-3);font-style:italic}
footer{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 40px;font-size:12.5px;color:var(--ink-3)}
@media (max-width:560px){.kpi .v{font-size:22px}.topbar-in{gap:8px;padding-block:8px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>/* Sakila analytics + recommendation engine (JS port of src/recommendation.py and src/tools.py).
   Works in the browser (window.SakilaEngine) and in node (module.exports) for parity tests. */
(function (root) {
  function Engine(D) {
    const cats = D.categories, K = cats.length, C = D.counts;
    const rowT = C.map(r => r.reduce((a, b) => a + b, 0));
    const colT = cats.map((_, j) => C.reduce((a, r) => a + r[j], 0));
    const N = rowT.reduce((a, b) => a + b, 0);
    const P = C.map((r, i) => r.map(v => v / rowT[i]));
    const base = colT.map(v => v / N);
    const lift = P.map(r => r.map((p, j) => p / base[j]));
    const Z = C.map((r, i) => r.map((v, j) => {
      const e = rowT[i] * base[j], rp = rowT[i] / N;
      return (v - e) / Math.sqrt(e * (1 - rp) * (1 - base[j]));
    }));
    const idx = Object.fromEntries(cats.map((c, i) => [c.toLowerCase(), i]));
    const film = id => { const f = D.films[id]; return f && { film_id: +id, title: f[0], category: cats[f[1]], rating: f[2], rental_rate: f[3], length: f[4], rentals_in_window: f[5], copies: f[6], available_copies: f[7], description: f[8] }; };
    const G = D.genre || { synonyms: {}, themes: {}, kid_words: [] };
    const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    function resolveGenre(text) {
      const t = String(text || "").trim().toLowerCase();
      for (const c of cats) if (c.toLowerCase() === t || c.toLowerCase().replace(/s$/, "") === t.replace(/s$/, ""))
        return { requested: text, exact: true, categories: [c], description_keyword: null, kid_safe: G.kid_words.includes(c.toLowerCase()) };
      for (const k of Object.keys(G.synonyms).sort((a, b) => b.length - a.length))
        if (new RegExp(`\\b${reEsc(k)}\\b`).test(t)) return { requested: text, exact: false, categories: G.synonyms[k], description_keyword: G.themes[k] || null, kid_safe: G.kid_words.includes(k) };
      return { requested: text, exact: false, categories: [], description_keyword: null, kid_safe: false };
    }
    const r4 = x => Math.round(x * 1e4) / 1e4;

    function catIndex(name) {
      if (name == null) return -1;
      const k = String(name).trim().toLowerCase();
      return k in idx ? idx[k] : -1;
    }
    function journey(cid) {
      const c = D.customers[cid];
      if (!c) return null;
      let prev = null;
      return c.r.map(([fid, date, amount], i) => {
        const f = film(fid);
        const step = prev == null ? "first rental" : (prev === f.category ? "repeat" : "switch");
        prev = f.category;
        return { rental_number: i + 1, rental_date: date, film_id: fid, title: f.title, category: f.category, rating: f.rating, amount, transition: step };
      });
    }
    function scoreCategories(history, wT, wA) {
      const last = catIndex(history[history.length - 1]);
      const counts = new Array(K).fill(0);
      history.forEach(h => counts[catIndex(h)]++);
      const tot = (wT + wA) || 1;
      return cats.map((c, j) => {
        const tp = P[last][j], aff = (counts[j] + 1) / (history.length + K);
        return { category: c, transition_probability: tp, affinity: aff, customer_rentals_in_category: counts[j],
          score: (wT * tp + wA * aff) / tot, lift: lift[last][j], z_residual: Z[last][j], transitions_from_last: C[last][j] };
      }).sort((a, b) => (b.score - a.score) || (b.transition_probability - a.transition_probability));
    }
    function recommendMovies(cid, category, n, availableOnly) {
      const c = D.customers[cid];
      const seen = new Set([...c.r.map(x => x[0]), ...c.x]);
      const ci = catIndex(category);
      return Object.keys(D.films).map(film)
        .filter(f => f.category === cats[ci] && !seen.has(f.film_id) && f.copies > 0 && (!availableOnly || f.available_copies > 0))
        .sort((a, b) => (b.rentals_in_window - a.rentals_in_window) || (b.available_copies - a.available_copies) || (a.title < b.title ? -1 : 1))
        .slice(0, n);
    }
    function recommend(cid, opts = {}) {
      const { exploration = false, nMovies = 5, nCategories = 3, availableOnly = true } = opts;
      const j = journey(cid);
      if (!j) throw new Error(`Customer ${cid} does not exist. Valid IDs are 1-599.`);
      const hist = j.map(x => x.category), last = hist[hist.length - 1], li = catIndex(last);
      let ranked = scoreCategories(hist, D.settings.w_t, D.settings.w_a);
      if (exploration) ranked = ranked.filter(r => r.category !== last);
      const top = ranked[0], it = D.independence;
      const strength = (it.p_value >= 0.05 || Math.abs(top.z_residual) < 1.96) ? "weak" : "moderate";
      const alt = {};
      ranked.slice(1, nCategories).forEach(r => { alt[r.category] = recommendMovies(cid, r.category, 3, availableOnly).map(m => m.title); });
      return {
        customer_id: +cid, customer_name: D.customers[cid].n, rentals_in_window: hist.length,
        recent_categories: hist.slice(-5), last_rental_date: j[j.length - 1].rental_date,
        current_category: last, mode: exploration ? "exploration (current category excluded)" : "standard",
        recommended_category: top.category, score: r4(top.score), transition_probability: r4(top.transition_probability),
        transitions_observed: top.transitions_from_last, outgoing_transitions_from_current: rowT[li],
        lift_vs_baseline: Math.round(top.lift * 1000) / 1000, z_residual: Math.round(top.z_residual * 100) / 100,
        customer_affinity: r4(top.affinity), customer_rentals_in_recommended_category: top.customer_rentals_in_category,
        signal_strength: strength, weights: { transition: D.settings.w_t, affinity: D.settings.w_a },
        ranked_categories: ranked.slice(0, Math.max(nCategories, 8)).map(r => ({ ...r, score: r4(r.score), transition_probability: r4(r.transition_probability), affinity: r4(r.affinity), lift: r4(r.lift), z_residual: Math.round(r.z_residual * 100) / 100 })),
        recommended_movies: recommendMovies(cid, top.category, nMovies, availableOnly),
        alternative_category_movies: alt,
        global_signal: { chi2_p_value: it.p_value, cramers_v: it.cramers_v },
      };
    }
    function categoryProfile(name, direction = "outgoing", topN = 5) {
      const i = catIndex(name);
      if (i < 0) throw new Error(`Unknown category '${name}'. Valid: ${cats.join(", ")}`);
      const it = D.independence;
      const stat = { p_value: it.p_value, cramers_v: it.cramers_v, uniform_probability: it.uniform_probability, cells_significant_after_bonferroni: it.cells_significant_after_bonferroni };
      if (direction === "incoming") {
        const src = cats.map((c, k) => ({ from_category: c, transitions: C[k][i], probability_from_source: r4(P[k][i]), lift: Math.round(lift[k][i] * 1000) / 1000, z_residual: Math.round(Z[k][i] * 100) / 100 }))

f rentals); only ~33% are returned on day 4-6. The ~5-day average is the middle of a flat distribution, not a peak.","Late copy-days beyond contract: 20,192; unused allowance days: 18,795 (calendar-day basis)."],"report_check":["Report's late rates (72.07% for 3-day ... 29.06% for 7-day) are reproduced with the exact-time definition; they are lower with calendar days. Always state the definition.","Report says customers have a 'stable ~5-day rental horizon'. The AVERAGE is ~5 for every policy, but the distribution is flat (1-9 days), so '5 days' is not a typical behaviour; the policy mainly decides who is labelled late.","Why customers return late (e.g. treating late fees as an extension fee) is not observable; it is a hypothesis."],"metrics_to_watch":{"avg_actual_hold_days":"mean (return_date - rental_date) in days","pct_late":"share of rentals kept longer than rental_duration (state exact-time or calendar-day definition)","late_copy_days":"sum of days beyond contract = inventory time locked by late rentals","unused_allowance_days":"contract days not used by early returns","pct_returned_day_4_to_6":"concentration around 5 days (tests the '5-day horizon' claim)"},"caveats":["A customer is 'late' because the policy threshold is exceeded: the same holding time is late under 3 days and early under 7 days (policy exposure, not worse behaviour).","Changing all durations to 5 days would change the labels, but the effect on real returns is a counterfactual that the data cannot show (Lucas critique: behaviour may change under a new policy).","Lost revenue from late returns is not observed (no record of customers who could not rent)."],"recommendations_hypotheses":["Test (A/B, one store or a subset of titles) a pre-due-date extension option priced below the late fee, and measure late_copy_days and availability.","Track actual holding time alongside the contract, by title demand level."],"follow_up_sql":"SELECT f.rental_duration,\n       COUNT(*) AS completed_rentals,\n       AVG((julianday(r.return_date) - julianday(r.rental_date))) AS avg_hold_days,   -- MySQL: TIMESTAMPDIFF(SECOND, r.rental_date, r.return_date)/86400\n       100.0 * SUM(CASE WHEN julianday(r.return_date) - julianday(r.rental_date) > f.rental_duration THEN 1 ELSE 0 END) / COUNT(*) AS pct_late\nFROM rental r JOIN inventory i ON i.inventory_id = r.inventory_id JOIN film f ON f.film_id = i.film_id\nWHERE r.return_date IS NOT NULL\nGROUP BY f.rental_duration ORDER BY f.rental_duration;","table":[{"rental_duration":3,"completed_rentals":3366,"avg_actual_hold_days":5.02,"pct_late_exact_time":72.07,"pct_early_exact_time":27.93,"pct_late_calendar_days":66.87,"pct_returned_day_4_to_6":33.39,"late_copy_days":7944,"unused_allowance_days":1136},{"rental_duration":4,"completed_rentals":3213,"avg_actual_hold_days":5.06,"pct_late_exact_time":61.84,"pct_early_exact_time":38.13,"pct_late_calendar_days":56.43,"pct_returned_day_4_to_6":33.52,"late_copy_days":5454,"unused_allowance_days":2106},{"rental_duration":5,"completed_rentals":3132,"avg_actual_hold_days":4.98,"pct_late_exact_time":50.19,"pct_early_exact_time":49.81,"pct_late_calendar_days":44.7,"pct_returned_day_4_to_6":31.99,"late_copy_days":3514,"unused_allowance_days":3600},{"rental_duration":6,"completed_rentals":3352,"avg_actual_hold_days":5.03,"pct_late_exact_time":39.47,"pct_early_exact_time":60.53,"pct_late_calendar_days":34.37,"pct_returned_day_4_to_6":33.14,"late_copy_days":2263,"unused_allowance_days":5483},{"rental_duration":7,"completed_rentals":2798,"avg_actual_hold_days":5.04,"pct_late_exact_time":29.06,"pct_early_exact_time":70.91,"pct_late_calendar_days":23.34,"pct_returned_day_4_to_6":32.56,"late_copy_days":1017,"unused_allowance_days":6470}],"hold_day_distribution":{"0":105,"1":1644,"2":1795,"3":1714,"4":1681,"5":1761,"6":1783,"7":1821,"8":1762,"9":1691,"10":104}},{"id":2,"title":"Customer loyalty (returning) does not translate into category loyalty","business_question":"When customers come back, do they stay in the same category?","verified_findings":["All 599 customers return (min 12, median 26 rentals).","93.19% of 15,263 consecutive rentals switch category; 6.81% repeat.","Rental 2 repeats rental 1's category in 7.51% of customers; of the 45 customers whose first two rentals share a category, 3 continue on rental 3.","Median customer has rented 13 of 16 categories; 98% have rented 10+.","Chance benchmark: random choice gives 6.32% repeats; shuffling each customer's own history gives 6.39% (permutation p = 0.0166). Repetition is only slightly above chance."],"report_check":["'Customers want exploration' is an interpretation: the switching rate is close to what random choice among 16 evenly-demanded categories produces.","Loyalty must be defined: store loyalty (returning) is 100%; category loyalty (repeat) is low."],"metrics_to_watch":{"repeat_pct":"consecutive rentals in the same category","switch_pct":"consecutive rentals changing category","distinct_categories_per_customer":"category diversity","random_choice_repeat_pct":"chance benchmark"},"caveats":["Low repetition does not mean categories have no value; it means the previous category is a weak predictor.","Same-timestamp rentals are ordered by rental_id (tie-breaker)."],"recommendations_hypotheses":["Promote discovery across categories rather than 'more of the same' genre.","Define loyalty KPIs separately: store retention vs category affinity."],"follow_up_sql":"WITH seq AS (\n  SELECT r.customer_id, c.name AS category,\n         LAG(c.name) OVER (PARTITION BY r.customer_id ORDER BY r.rental_date, r.rental_id) AS prev_category\n  FROM rental r JOIN inventory i ON i.inventory_id = r.inventory_id\n  JOIN film_category fc ON fc.film_id = i.film_id JOIN category c ON c.category_id = fc.category_id\n  WHERE r.rental_date < '2006-01-01')\nSELECT 100.0 * SUM(CASE WHEN category = prev_category THEN 1 ELSE 0 END) / COUNT(*) AS repeat_pct\nFROM seq WHERE prev_category IS NOT NULL;"},{"id":3,"title":"Customers rent while still holding DVDs; zero holdings are a repeated pause, not churn","business_question":"How many DVDs do customers hold when they rent again, and how quickly do they come back after returning everything?","verified_findings":["At 15,862 checkouts (window) customers already hold 2.44 DVDs on average; 79.77% of checkouts happen while holding at least one (0: 20.23%, 1: 19.82%, 2: 17.66%, 3+: 42.29%).","3,208 zero-holding episodes across 599 customers; 2,610 are followed by another rental inside the window and 598 are censored (no later data), not churn.","Calendar clock: 67.93% of reactivations happen 7-14 days later.","Recorded-date clock (counting only dates with any rental): 11.99% by the 1st, 61.84% by the 2nd, 81.84% by the 3rd, 91.26% by the 4th recorded date.","The two clocks classify 248 episodes (213 customers) differently (early = within 4 recorded dates vs within 14 calendar days)."],"report_check":["Report's 2.44 average, 3,208 episodes and 67.93% (7-14 days) are reproduced.","The 7-14 day 'wait' is largely an artefact of the data: rentals were recorded in 8-day bursts separated by ~2-week gaps, so a return near the end of a burst can only be followed by a rental in the next burst.","Holding 3 DVDs does not CAUSE more visits; the association is observational. The mean (2.44) is not an optimal target."],"metrics_to_watch":{"avg_prior_open_rentals":"DVDs already held at checkout (interval reconstruction)","zero_state_episodes":"returns that leave the customer holding nothing","reactivation_by_recorded_date":"share of reactivations within k recorded dates","censored_episodes":"zero states with no later observation (not churn)"},"caveats":["Zero holdings is not churn; churn cannot be observed in a finite, censored dataset.","Episodes are not unique customers (a customer can have many episodes).","The 174-day gap and 2-week gaps between bursts distort calendar-day measures."],"recommendations_hypotheses":["When a customer is down to 1 open DVD, show 2-3 next-title suggestions at return; test with a control group."],"follow_up_sql":"-- DVDs held at each checkout (interval reconstruction)\nSELECT cur.rental_id, COUNT(prev.rental_id) AS prior_open_rentals\nFROM rental cur\nLEFT JOIN rental prev ON prev.customer_id = cur.customer_id AND prev.rental_id <> cur.rental_id\n     AND prev.rental_date < cur.rental_date AND (prev.return_date IS NULL OR prev.return_date > cur.rental_date)\nWHERE cur.rental_date < '2006-01-01'\nGROUP BY cur.rental_id;","prior_open_distribution":{"0":3209,"1":3144,"2":2801,"3":2376,"4":1716,"5":2616},"calendar_buckets_pct":{"<=1 day":7.2,"1-3 days":3.75,"3-7 days":10.38,"7-14 days":67.93,"14-30 days":10.46,">30 days":0.27},"recorded_date_cumulative_pct":{"by_1_recorded_date":11.99,"by_2_recorded_date":61.84,"by_3_recorded_date":81.84,"by_4_recorded_date":91.26}},{"id":4,"title":"Category transitions: the strongest routes are weak signals","business_question":"After category A, is category B disproportionately likely next (lift), and is it usable for bundles/recommendations?","verified_findings":["Top lifts (all next rentals as denominator): Classics->Comedy lift 1.32 (70 transitions, z 2.46); Games->Action lift 1.30 (83 transitions, z 2.55); Family->Travel lift 1.29 (70 transitions, z 2.27); New->Classics lift 1.28 (67 transitions, z 2.13); Children->Sports lift 1.25 (83 transitions, z 2.20).","Report's definition (switches only as denominator) gives: Games->Action 1.41; Classics->Comedy 1.40; Family->Travel 1.37; New->Classics 1.37; Children->Sports 1.34. Same pairs, higher values because repeats are removed from the denominator.","Whole matrix: chi-square p = 0.4351, Cramer's V = 0.0315; 15 of 256 pairs exceed |z| 1.96 (~13 expected by chance); 0 survive Bonferroni.","Hold-out test: transition-based top-3 hit rate 19.87% vs random 18.75%."],"report_check":["Games->Action lift ~1.4 is reproduced under the report's definition, but it is not statistically distinguishable from chance after multiple-comparison correction.","Lift 1.4 means B is 1.4 times as likely as its baseline share, NOT that 140% of customers rent B.","Lift is association, not causation (A does not make customers want B).","Each Sakila film has exactly one category (film_category is one-to-one here)."],"metrics_to_watch":{"transition_probability":"P(B|A) = count(A->B)/count(A->any)","lift":"P(B|A) / share of B (controls for B's popularity)","z_residual":"deviation from independence; judge against multiple comparisons","hit@3":"hold-out predictive accuracy"},"caveats":["Use lift, not raw counts (raw counts favour big categories).","With 256 pairs some high lifts appear by chance."],"recommendations_hypotheses":["Treat high-lift pairs as candidates for a small bundle/placement test, not as proven demand routes."],"follow_up_sql":"WITH seq AS (\n  SELECT r.customer_id, c.name AS category,\n         LAG(c.name) OVER (PARTITION BY r.customer_id ORDER BY r.rental_date, r.rental_id) AS prev_category\n  FROM rental r JOIN inventory i ON i.inventory_id = r.inventory_id\n  JOIN film_category fc ON fc.film_id = i.film_id JOIN category c ON c.category_id = fc.category_id\n  WHERE r.rental_date < '2006-01-01'),\npairs AS (SELECT prev_category AS a, category AS b, COUNT(*) AS n FROM seq WHERE prev_category IS NOT NULL GROUP BY prev_category, category),\nout_a AS (SELECT a, SUM(n) AS n_a FROM pairs GROUP BY a),\nshare_b AS (SELECT b, 1.0 * SUM(n) / (SELECT SUM(n) FROM pairs) AS share FROM pairs GROUP BY b)\nSELECT p.a AS from_category, p.b AS to_category, p.n AS transitions,\n       1.0 * p.n / o.n_a AS p_b_given_a, (1.0 * p.n / o.n_a) / s.share AS lift\nFROM pairs p JOIN out_a o ON o.a = p.a JOIN share_b s ON s.b = p.b\nWHERE p.a <> p.b\nORDER BY lift DESC;"},{"id":5,"title":"Every customer is a hybrid buyer; demand per title is similar across price tiers","business_question":"Are $0.99 renters bargain hunters, and is there room to bundle single $0.99 'visits' into bigger baskets?","verified_findings":["Customer segments by price tiers used: {'hybrid': 599} (all customers mix $0.99 with $2.99/$4.99 titles).","Same-day 'visits' containing a $0.99 title: 4,876; 51.33% are a single $0.99 disc; 2-disc visits average $4.36 list value.","Rentals per title by price: $0.99: 17.34, $2.99: 16.41, $4.99: 16.48 (nearly equal)."],"report_check":["A 'visit' is approximated as customer + calendar date; Sakila has no visit/basket id, so basket figures are a heuristic.","Report text says 48.67% of visits have 'three or more' rentals; it is two or more.","Equal demand across fixed price tiers is NOT a price-elasticity estimate: each title has one fixed price, and price is confounded with the title.","The $250 bundle upside in the report is an assumption-based illustration, not a forecast."],"metrics_to_watch":{"single_0.99_visit_share":"same-day visits with only one $0.99 disc","avg_visit_value":"sum of rental_rate per same-day visit","rentals_per_title_by_tier":"demand per title at each fixed price"},"caveats":["Lucas critique: behaviour observed under today's fixed prices and no bundles may change once bundles/combos exist, so historical ratios cannot predict the effect of a new pricing policy.","No cost data: profit/margin of a bundle cannot be computed; replacement_cost is not acquisition cost."],"recommendations_hypotheses":["Pilot a combo (e.g. 2 same-category $0.99 titles priced between $0.99 and $1.98, the report's example is $1.49) in one store or period; compare basket size, revenue per visit and availability with a control group before rollout."],"follow_up_sql":"SELECT customer_id, DATE(rental_date) AS visit_day, COUNT(*) AS discs,\n       SUM(f.rental_rate) AS visit_value\nFROM rental r JOIN inventory i ON i.inventory_id = r.inventory_id JOIN film f ON f.film_id = i.film_id\nGROUP BY customer_id, DATE(rental_date);","basket_table":[{"discs":1,"visits":2503,"pct":51.33,"avg_value":0.99},{"discs":2,"visits":1600,"pct":32.81,"avg_value":4.36},{"discs":3,"visits":572,"pct":11.73,"avg_value":7.39},{"discs":4,"visits":157,"pct":3.22,"avg_value":11.07},{"discs":5,"visits":40,"pct":0.82,"avg_value":13.7},{"discs":6,"visits":3,"pct":0.06,"avg_value":18.61},{"discs":7,"visits":1,"pct":0.02,"avg_value":18.93}],"price_tiers":[{"rental_rate":0.99,"rentals":5652,"titles":326,"rentals_per_title":17.34},{"rental_rate":2.99,"rentals":5120,"titles":312,"rentals_per_title":16.41},{"rental_rate":4.99,"rentals":5272,"titles":320,"rentals_per_title":16.48}]},{"id":6,"title":"Rentals track the number of copies; productivity differs by film","business_question":"Do films with more copies get more rentals, and are copies used equally productively?","verified_findings":["958 of 1000 films have copies (42 have none, so their zero rentals mean 'not stocked', not 'unpopular').","Spearman correlation copies vs rentals: rho = 0.935 (p < 0.001) - strong association.","Productivity quartiles (rentals per copy): Q1: 2.85 (1107 copies, 3150 rentals); Q2: 3.34 (1197 copies, 3993 rentals); Q3: 3.68 (1239 copies, 4557 rentals); Q4: 4.18 (1038 copies, 4344 rentals).","Average rentals per copy barely changes with the number of copies: 2 copies 3.60, 3 copies 3.54, 4 copies 3.54, 5 copies 3.53, 6 copies 3.46, 7 copies 3.48, 8 copies 3.47 - rentals rise almost proportionally with copies.","Rentals per copy by category range from 3.41 (Horror) to 3.58 (Music)."],"report_check":["Report's rho 0.935 is reproduced; quartile totals differ slightly because of tie handling.","Association, not causation: films with more demand may have been given more copies; adding copies is not proven to add rentals.","Rentals per copy is a utilisation proxy; unmet demand, costs and profit are not in the data, so 'which category to buy more of' cannot be concluded from it alone."],"metrics_to_watch":{"rentals_per_copy":"rentals / physical copies (utilisation proxy)","films_with_no_copies":"catalogue titles that cannot be rented","spearman_rho":"rank association copies vs rentals"},"caveats":["A film with zero rentals may simply have no copies or short observation.","Removal/purchase decisions need costs and unmet demand, which are not recorded."],"recommendations_hypotheses":["Review high-productivity/low-copy films for a small copy increase and measure the change; review low-productivity/high-copy films before any reduction."],"follow_up_sql":"SELECT f.film_id, f.title, COUNT(DISTINCT i.inventory_id) AS copies, COUNT(r.rental_id) AS rentals,\n       1.0 * COUNT(r.rental_id) / NULLIF(COUNT(DISTINCT i.inventory_id), 0) AS rentals_per_copy\nFROM film f LEFT JOIN inventory i ON i.film_id = f.film_id LEFT JOIN rental r ON r.inventory_id = i.inventory_id\nGROUP BY f.film_id, f.title ORDER BY rentals_per_copy DESC;","quartiles":[{"quartile":"Q1","films":240,"copies":1107,"rentals":3150,"revenue":14105.44,"rentals_per_copy":2.85},{"quartile":"Q2","films":239,"copies":1197,"rentals":3993,"revenue":16101.09,"rentals_per_copy":3.34},{"quartile":"Q3","films":239,"copies":1239,"rentals":4557,"revenue":18503.43,"rentals_per_copy":3.68},{"quartile":"Q4","films":240,"copies":1038,"rentals":4344,"revenue":18696.6,"rentals_per_copy":4.18}],"category_utilisation":[{"category":"Music","copies":232,"rentals":830,"rentals_per_copy":3.58},{"category":"Documentary","copies":294,"rentals":1050,"rentals_per_copy":3.57},{"category":"Action","copies":312,"rentals":1112,"rentals_per_copy":3.56},{"category":"Travel","copies":235,"rentals":837,"rentals_per_copy":3.56},{"category":"Family","copies":310,"rentals":1096,"rentals_per_copy":3.54},{"category":"Drama","copies":300,"rentals":1060,"rentals_per_copy":3.53},{"category":"Sci-Fi","copies":312,"rentals":1101,"rentals_per_copy":3.53},{"category":"Children","copies":269,"rentals":945,"rentals_per_copy":3.51},{"category":"Games","copies":276,"rentals":969,"rentals_per_copy":3.51},{"category":"Comedy","copies":269,"rentals":941,"rentals_per_copy":3.5},{"category":"Animation","copies":335,"rentals":1166,"rentals_per_copy":3.48},{"category":"Classics","copies":270,"rentals":939,"rentals_per_copy":3.48},{"category":"Foreign","copies":300,"rentals":1033,"rentals_per_copy":3.44},{"category":"Sports","copies":344,"rentals":1179,"rentals_per_copy":3.43},{"category":"New","copies":275,"rentals":940,"rentals_per_copy":3.42},{"category":"Horror","copies":248,"rentals":846,"rentals_per_copy":3.41}]}],"limits":[{"topic":"chronology","limitation":"Rentals exist only on 41 dates: five 8-day bursts in May-Aug 2005 plus one day (2006-02-14). There is a 174-day gap (Aug 24 2005 - Feb 13 2006); Sep 2005-Jan 2006 have no data. Month/quarter/year growth, seasonality, churn by month and forecasts are unreliable; Feb 14 cannot be attributed to Valentine's Day."},{"topic":"visits","limitation":"No visit, basket, session, browsing, search, store-entry or display data. Same customer + same date is only a heuristic for a visit."},{"topic":"demographics","limitation":"No age, gender, income, wealth, tourist status or acquisition channel. Customer address is not a demand location. No demographic personas or LTV by demographic."},{"topic":"causality","limitation":"All data is observational: no experiments. Correlations (price, length, copies, lift, staff, holdings) cannot prove causes; counterfactuals (price cuts, policy changes, more copies) cannot be measured. Lucas critique: behaviour under current policies may change when policies change."},{"topic":"unobserved_demand","limitation":"Failed rentals, unavailable-copy events, substitutions, abandonment and unmet demand are not recorded, so lost sales and lost revenue cannot be measured."},{"topic":"money","limitation":"No acquisition cost, operating cost, commissions or profit. replacement_cost is a replacement charge attribute, not purchase cost. payment rows have no charge-type field; amount - rental_rate is only a late-fee proxy (matches days late exactly in ~72% of rentals, and 852 late rentals have no extra charge)."},{"topic":"ratings","limitation":"film.rating is an MPAA content classification (G/PG/PG-13/R/NC-17), not a customer review score. No satisfaction or service-quality data."},{"topic":"staff_store","limitation":"Two stores and two staff. A rental can be linked to the customer's store, the inventory's store or the staff member's store; state which. Store 'efficiency', market share, closures and new locations need data Sakila does not have."},{"topic":"actors","limitation":"A film has several actors; attributing a film's full revenue to each actor double-counts. Renting a film with an actor does not prove preference for that actor."},{"topic":"churn","limitation":"Churn and lifetime value cannot be observed in a short, censored window; zero holdings is not churn."},{"topic":"forecast","limitation":"No reliable demand forecast: 4 months of bursty, partly synthetic data with a large gap. Offer scenario methods and what data is needed, not point forecasts."},{"topic":"bcg","limitation":"A true BCG matrix needs market growth and relative market share against competitors; Sakila has neither. Only an internal proxy (share of Sakila rentals vs change between bursts) is possible, and it must not justify betting on one category: demand is spread evenly and customers switch 93% of the time."}],"trends":{"month":{"granularity":"month","rows":[{"period":"2005-05","rentals":1156,"revenue":4823.44,"active_customers":520,"recorded_days":8,"rentals_per_recorded_day":144.5,"has_data":true},{"period":"2005-06","rentals":2311,"revenue":9629.89,"active_customers":590,"recorded_days":8,"rentals_per_recorded_day":288.9,"has_data":true},{"period":"2005-07","rentals":6709,"revenue":28368.91,"active_customers":599,"recorded_days":14,"rentals_per_recorded_day":479.2,"has_data":true},{"period":"2005-08","rentals":5686,"revenue":24070.14,"active_customers":599,"recorded_days":10,"rentals_per_recorded_day":568.6,"has_data":true},{"period":"2005-09","rentals":0,"revenue":0.0,"active_customers":0,"recorded_days":0,"rentals_per_recorded_day":null,"has_data":false e number of recorded days); absolute totals are not. Changes of +/-1 percentage point are within normal noise for ~1,000-4,000 rentals per burst. This is NOT market growth, so a real BCG matrix cannot be built."},"testbank":[{"q":"How many insights are there?","guide":"There are exactly SIX insights in the team report. List their titles.","tools":["get_insights"]},{"q":"What are the insights?","guide":"List all six insights with one verified finding each; offer detail per insight.","tools":["get_insights"]},{"q":"Give me the follow-up SQL query with the insights","guide":"Call get_insights(insight_id) for 1-6 and show each follow_up_sql in a sql code block with one line on what it returns.","tools":["get_insights"]},{"q":"Can you visualize the insights?","guide":"Call visualize with chart_ids insight_1..insight_6 (plus hold_days/prior_open if useful); describe each chart in one line.","tools":["visualize"]},{"q":"How many stores are there?","guide":"metric_name='stores': two stores (Lethbridge, Canada; Woodridge, Australia) with customers, copies, rentals, revenue.","tools":["get_business_metrics"]},{"q":"Explain the metrics?","guide":"Define the metrics_to_watch of each insight exactly (formula + meaning), e.g. rentals per copy, lift, repeat rate, pct_late (state exact-time vs calendar-day).","tools":["get_insights"]},{"q":"What are the most important metrics that we should pay close attention for that insights?","guide":"Pick 1-2 KPIs per insight from metrics_to_watch and say why each matters and how to track it.","tools":["get_insights"]},{"q":"Tell me a full story with the insights, in a business language","guide":"Story arc in MBB style: situation (all customers return) -> complication (policies, prices, inventory set per title while behaviour is uniform) -> resolution (pilot tests). Use verified numbers; end with limitations.","tools":["get_insights","get_data_limitations"]},{"q":"Make a report for me","guide":"Consulting (MBB) format: action title, executive summary (SCR), key findings per insight (headline, evidence, implication), prioritised testable recommendations with KPI and pilot, risks & data limitations, 30/60/90 next steps.","tools":["get_insights","get_data_limitations","visualize"]},{"q":"What are the current trend in customer behavior, categories, etc?","guide":"Behaviour: every customer returns, 93% switch category, ~2.4 DVDs held at checkout. Categories: shares stable per burst (category_share_by_burst). Warn that time trends are unreliable because of bursts and the 174-day gap.","tools":["get_trends","get_insights","get_business_metrics"]},{"q":"What should be the price if I sell in combo/in bulk?","guide":"Use insight 5 (single $0.99 visits share, 2-disc visit value, equal demand per title across tiers). No elasticity or cost data: any combo price is illustrative (e.g. between one $0.99 and two). Apply the Lucas critique: behaviour under current fixed prices may change once combos exist, so run an A/B pilot and measure basket size and revenue per visit.","tools":["get_insights","get_data_limitations"]},{"q":"Forecast/Predict the demand if Sakila was a real rental chain?","guide":"Refuse a point forecast: 41 recorded dates in 8-day bursts, 174-day gap, partly synthetic. Show per-burst volumes as context, explain what data is needed, and outline a scenario/run-rate method labelled illustrative.","tools":["get_trends","get_data_limitations"]},{"q":"What should Sakila do to tackle the current business problems of Sakila?","guide":"Prioritised, testable initiatives tied to insights: extension option vs late fee (1), cross-category discovery (2,4), next-title prompts at 1 open DVD (3), bundle pilot (5), copy review by rentals per copy (6). Each with KPI and pilot; state limitations.","tools":["get_insights","get_data_limitations"]},{"q":"Analyze any trend in months, quarters and year?","guide":"Show month/quarter/year tables and explain the chronological gap: data only in five 8-day bursts May-Aug 2005 and one day in Feb 2006; Sep 2005-Jan 2006 missing, not zero. Totals mostly reflect recorded days; per-recorded-day values only.","tools":["get_trends"]},{"q":"What are the customer persona for Sakila?","guide":"metric_name='customer_segments': behavioural 2x2 (frequency x late-return share). No age/gender/income data, so no demographic personas.","tools":["get_business_metrics"]},{"q":"Use the BCG matrix to actually categorize the customer segments and titles/categories.","guide":"A real BCG needs market growth and relative market share vs competitors - not in Sakila. Offer only an internal proxy (share of Sakila rentals vs change in share between bursts, category_share_by_burst) with the warning that differences are within noise.","tools":["get_data_limitations","get_business_metrics"]},{"q":"Should Sakila totally invest in one title/category?","guide":"No. Demand is spread evenly (5.2%-7.3% per category), customers switch category 93% of the time and have rented a median 13 categories; concentration would lose most demand.","tools":["get_business_metrics","get_insights"]},{"q":"What is the average number of DVDs a customer is already holding when they make another rental?","guide":"Insight 3: interval reconstruction (rentals started before and not yet returned at checkout) = ~2.44; give the 0/1/2/3+ distribution.","tools":["get_insights"]},{"q":"Are customers more likely to make another rental while already holding a DVD than when holding none?","guide":"Most checkouts (~80%) happen while holding at least one DVD; this is an association and depends on how long people hold DVDs - not a statement about likelihood per state without exposure time.","tools":["get_insights"]},{"q":"Does holding three DVDs cause customers to return to the store more frequently?","guide":"Causality cannot be established from observational data; frequent renters naturally hold more DVDs (reverse causality).","tools":["get_insights","get_data_limitations"]},{"q":"At what exact number of DVDs does a customer become most likely to make another rental?","guide":"The mean (2.44) is not an optimal threshold; there is no exposure-adjusted hazard in the data. Show the distribution only.","tools":["get_insights"]},{"q":"Which customers churned permanently from Sakila?","guide":"Churn is not observable: finite, censored window with a 174-day gap; 598 zero-state episodes are censored, not churn.","tools":["get_data_limitations"]},{"q":"How long after entering zero holdings does a customer usually rent again?","guide":"Calendar clock: 67.93% within 7-14 days; recorded-date clock: ~62% by the 2nd and ~91% by the 4th recorded date. Explain censoring and that the 7-14 day peak mirrors the 2-week gaps between bursts.","tools":["get_insights"]},{"q":"Is a customer with zero open rentals considered churned?","guide":"No - false premise. Zero holdings is a normal, repeated pause (3,208 episodes across all 599 customers).","tools":["get_insights"]},{"q":"What percentage of zero-state episodes reactivate by the fourth subsequent recorded rental date?","guide":"About 91% of reactivated EPISODES (not customers) by the 4th recorded date; distinguish episodes from unique customers and mention censored episodes.","tools":["get_insights"]},{"q":"Why do calendar-day and recorded-date reactivation measurements give different results?","guide":"Rentals are recorded only on 41 dates in 8-day bursts with ~2-week gaps, so calendar days include unrecorded days; the recorded-date clock counts only observed days.","tools":["get_insights","get_business_metrics"]},{"q":"Did customers really wait 7-14 days before returning, or could that pattern be caused by missing dates?","guide":"Likely an artefact: rentals exist only in 8-day bursts separated by ~2 weeks, so a return late in one burst can only be followed by a rental in the next burst.","tools":["get_business_metrics"]},{"q":"Which customers are classified as early reactivators under one clock but late under another?","guide":"Insight 3 counts episodes where 'within 4 recorded dates' and 'within 14 calendar days' disagree; list customers with run_sql_query if asked.","tools":["get_insights","run_sql_query"]},{"q":"What was the store doing during the 174-day gap between August 2005 and February 2006?","guide":"Not inferable: there are no records; missing data is not zero activity.","tools":["get_business_metrics"]},{"q":"Was the February 14, 2006 rental spike caused by Valentine's Day demand?","guide":"Not supported: it is a single anomalous day of 182 rentals, all never returned, after a 174-day gap; excluded from analysis.","tools":["get_business_metrics"]},{"q":"What was the month-over-month customer growth rate from September to December 2005?","guide":"Cannot be computed: there are no rental observations Sep-Dec 2005.","tools":["get_trends"]},{"q":"Which month had the strongest organic demand growth?","guide":"Cannot be said: month totals reflect the number of recorded days (8, 8, 14, 10); per-recorded-day values are shown only as descriptive, not organic growth.","tools":["get_trends"]},{"q":"Do customers naturally need approximately five days to watch a DVD?","guide":"Not observable. The average is ~5 days for every policy, but holding days are spread almost uniformly from 1 to 9 days; 5 is the middle of a flat distribution, not a natural need.","tools":["get_insights"]},{"q":"Do customers keep 3-, 4-, 5-, 6-, and 7-day rentals for materially different amounts of time?","guide":"No: average hold is 4.98-5.06 days for every policy; correlation with policy ~0.","tools":["get_insights"]},{"q":"Are 3-day rental customers worse at returning DVDs than 7-day rental customers?","guide":"No evidence: they hold DVDs just as long; the 3-day policy exposes more rentals to the 'late' label (policy exposure).","tools":["get_insights"]},{"q":"Is a customer classified as late because of their behavior or because of the film's rental-duration rule?","guide":"Mostly the rule: holding time is the same across policies, so the threshold decides the label.","tools":["get_insights"]},{"q":"Would changing every rental duration to five days reduce late returns?","guide":"Mechanically fewer rentals would be labelled late at current holding times, but the real effect is a counterfactual (Lucas critique); test it.","tools":["get_insights","get_data_limitations"]},{"q":"How many inventory-days are held beyond contractual rental duration?","guide":"Insight 1 late_copy_days (calendar-day basis, all completed rentals) with the definition.","tools":["get_insights"]},{"q":"How much revenue did Sakila lose because DVDs were returned late?","guide":"Lost revenue is not observed (no record of customers who could not rent). Show late copy-days and the late-fee proxy as what IS observable.","tools":["get_data_limitations"]},{"q":"How many customers tried to rent a film but could not because every copy was unavailable?","guide":"Failed demand is not recorded.","tools":["get_data_limitations"]},{"q":"Which late rentals occurred while another customer rented the same film from the same store?","guide":"Reconstructable: self-join rentals of the same film and store where one rental is past due and another rental of that film starts during the overdue period.","tools":["run_sql_query"]},{"q":"How often did a late-held copy coincide with the final remaining copy being checked out?","guide":"Requires occupancy reconstruction per film and store over time; can be approximated with SQL, and is inventory pressure, not proven lost sales.","tools":["run_sql_query"]},{"q":"Does a last-copy event prove Sakila lost a sale?","guide":"No: availability risk is not an observed lost sale.","tools":["get_data_limitations"]},{"q":"Which category should Sakila buy more inventory for?","guide":"Cannot be concluded from rentals/copies alone (no unmet demand, costs or margins). Rentals per copy by category is only a utilisation proxy; suggest a test.","tools":["get_insights","get_data_limitations"]},{"q":"Which category has the highest rental demand relative to its number of physical copies?","guide":"Insight 6 category_utilisation: rentals per copy by category (legitimate utilisation proxy); note differences are small.","tools":["get_insights"]},{"q":"What is Sakila's acquisition cost per DVD?","guide":"Not in the data; replacement_cost is not acquisition cost.","tools":["get_data_limitations"]},{"q":"Which category is the most profitable?","guide":"Profit cannot be computed without costs; revenue by category can be shown instead.","tools":["get_data_limitations","get_business_metrics"]},{"q":"Is replacement_cost the amount Sakila originally paid to acquire the DVD?","guide":"No: it is the charge if a DVD is lost/damaged (range $9.99-$29.99), not purchase cost.","tools":["get_business_metrics"]},{"q":"What percentage of payment revenue comes specifically from late fees?","guide":"Payments have no charge-type field. amount - rental_rate is a proxy (~30% of revenue) and is not an exact late fee; say 'estimated'.","tools":["get_business_metrics"]},{"q":"Does payment.amount - film.rental_rate always equal the late fee?","guide":"No: it matches rounded-up days late in ~72% of rentals, and 852 late rentals have no extra charge.","tools":["run_sql_query","get_data_limitations"]},{"q":"Do late customers knowingly treat late fees as extension fees?","guide":"Intention/perception is unobserved; it is a hypothesis needing a survey or experiment.","tools":["get_data_limitations"]},{"q":"Do higher late fees make customers return DVDs sooner?","guide":"No policy variation/experiment exists; causal effect cannot be identified.","tools":["get_data_limitations"]},{"q":"Which customers are the most loyal?","guide":"First define loyalty (e.g. rentals, active months, recency, category repeat). Then rank by that definition and say which definition is used.","tools":["get_business_metrics","run_sql_query"]},{"q":"Are high-frequency customers more loyal to individual movie categories?","guide":"Separate store engagement from category affinity: frequent customers explore MORE categories; category repeat stays near chance.","tools":["get_business_metrics"]},{"q":"What percentage of consecutive rentals remain in the same category?","guide":"6.81% (window, ordered by rental_date then rental_id); 93.19% switch.","tools":["get_business_metrics"]},{"q":"If customers rarely repeat categories, does that mean categories have no predictive value?","guide":"Not necessarily - check transition lift; here lifts are small and not significant after correction, so predictive value is weak (hold-out ~ random).","tools":["get_insights"]},{"q":"After renting Category A, which Category B is disproportionately likely to come next?","guide":"Use lift (P(B|A)/share of B), not raw counts; give top lifts with counts and say none survive multiple-comparison correction.","tools":["get_category_transitions","get_insights"]},{"q":"Why is transition lift preferable to simply ranking the most common next category?","guide":"Lift controls for the destination's baseline popularity; raw counts favour big categories.","tools":["get_insights"]},{"q":"If Action -> Sci-Fi has lift 1.4, does that mean 140% of Action customers rent Sci-Fi next?","guide":"No: lift 1.4 means Sci-Fi is 1.4x as likely after Action as its overall share; the probability itself is still small (~6-9%).","tools":[]},{"q":"Does a high transition lift prove customers prefer Category B because of Category A?","guide":"No: association, not causation.","tools":[]},{"q":"Which actor generates the most revenue for Sakila?","guide":"Films have several actors; full revenue credited to each actor double-counts. If shown, label it 'revenue of films featuring the actor' or split revenue across actors.","tools":["run_sql_query","get_business_metrics"]},{"q":"Which actor is customers' favorite actor?","guide":"Not observable; rentals of films featuring an actor do not show preference for the actor.","tools":["get_business_metrics"]},{"q":"Which films have the highest customer ratings?","guide":"No customer ratings exist; film.rating is an MPAA content classification.","tools":["get_business_metrics"]},{"q":"Which customers prefer English-language films?","guide":"Film language is observable (check the language table), but customer language preference cannot be inferred.","tools":["run_sql_query"]},{"q":"What is the average basket size per customer visit?","guide":"No visit id: using customer + date as a heuristic, ~1.47 rentals per same-day group; say it is an approximation.","tools":["get_business_metrics"]},{"q":"Which store generated a rental: the customer's registered store, the inventory's store, or the staff member's store?","guide":"They disagree for about half of rentals; choose by business meaning (inventory store = where the copy is; staff store = who processed it) and state it.","tools":["get_business_metrics"]},{"q":"What is the single best strategy Sakila should implement to maximize profit next year?","guide":"Cannot be determined (no costs, competition, future data, causal effects). Offer a prioritised set of pilots instead.","tools":["get_data_limitations","get_insights"]},{"q":"How many unique visits did each customer make to the store?","guide":"No visit_id; rentals are not visits. Only a same-day heuristic is possible.","tools":["get_business_metrics"]},{"q":"Which customers rented multiple DVDs during the same visit?","guide":"Define a visit first (same customer and date, or time window) and say it is an assumption.","tools":["run_sql_query"]},{"q":"What is the average time customers physically spend inside a Sakila store?","guide":"No entry/exit timestamps; not measurable.","tools":["get_data_limitations"]},{"q":"Which customers browse frequently but rarely rent?","guide":"Browsing is not recorded.","tools":["get_data_limitations"]},{"q":"Which films were searched for most often but not rented?","guide":"Search/request data is absent.","tools":["get_data_limitations"]},{"q":"Which customers abandoned their purchase because a film was unavailable?","guide":"Abandonment is unobserved.","tools":["get_data_limitations"]},{"q":"Which films were displayed most prominently in the store?","guide":"No merchandising/display data.","tools":["get_data_limitations"]},{"q":"Does placing a film in a particular category cause it to receive more rentals?","guide":"Category assignment is not an experimental treatment; each film has one fixed category.","tools":["get_data_limitations"]},{"q":"Do longer films cause customers to return DVDs later?","guide":"Correlation length vs holding days is ~0 (-0.005); causality cannot be claimed anyway.","tools":["get_business_metrics"]},{"q":"Are PG-13 films more profitable than R-rated films?","guide":"Profit unavailable; rating is a classification. Revenue by rating can be shown.","tools":["get_data_limitations","run_sql_query"]},{"q":"Are customers with higher spending more satisfied?","guide":"Satisfaction is not recorded.","tools":["get_data_limitations"]},{"q":"Do customers who pay more become more loyal afterward?","guide":"Temporal association could be described; a causal loyalty effect is unsupported.","tools":["get_data_limitations"]},{"q":"Does paying a late fee discourage future rentals?","guide":"Would need before/after behaviour with controls; observational association only, with causal caution.","tools":["get_data_limitations","run_sql_query"]},{"q":"Which customers stopped renting because they were charged too much?","guide":"Reasons for inactivity are unobserved, and stopping cannot be distinguished from censoring.","tools":["get_data_limitations"]},{"q":"Did customers switch stores because of poor inventory availability?","guide":"Store-switch motive is unavailable.","tools":["get_data_limitations"]},{"q":"Which store has better customer service?","guide":"No service-quality variable.","tools":["get_data_limitations"]},{"q":"Which staff member provides the best customer experience?","guide":"No satisfaction/ <script>(function () {
"use strict";
const D = window.SAKILA_DATA, E = window.SakilaEngine(D), SQL = window.SAKILA_SQL || {};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (x, d = 2) => `${(100 * x).toFixed(d)}%`;
const money = n => "$" + fmt(n, 2);
const title = s => String(s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const state = { customer: 42, exploration: false, inStock: true, heat: "prob", rankBy: "transitions", fromCat: "Action", journeyCustomer: 42 };
try { const s = JSON.parse(localStorage.getItem("sakila-ui") || "{}"); Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem("sakila-ui", JSON.stringify(state)); } catch (e) {} };

/* ------------------------------------------------------------------ tooltip */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("scroll", () => { tip.hidden = true; }, true);

/* ------------------------------------------------------------------ SVG chart kit */
const W = el => Math.max(300, Math.floor(el.clientWidth || el.parentElement.clientWidth || 600));
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">${body}<\/svg>`;
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" style="fill:${o.fill || "var(--ink-3)"};font:${o.weight || 400} ${o.size || 11.5}px var(--body)" text-anchor="${o.anchor || "start"}" ${o.baseline ? `dominant-baseline="${o.baseline}"` : ""}>${esc(s)}<\/text>`;
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const m = v / p; return ([1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => m <= x + 1e-9)) * p; }
function ticks(max, n = 4) { const s = niceMax(max / n); const out = []; for (let v = 0; v <= max + 1e-9; v += s) out.push(v); return out; }

function barV(el, labels, values, o = {}) {
  const w = W(el), h = o.h || 280, L = o.left || 44, R = 10, T = 22, B = 34;
  const max = niceMax(Math.max(...values) * 1.12), ih = h - T - B, iw = w - L - R, bw = iw / labels.length;
  let s = ticks(max).map(v => { const y = T + ih - v / max * ih; return `<line x1="${L}" x2="${w - R}" y1="${y}" y2="${y}" style="stroke:var(--rule)"/>` + txt(L - 6, y, (o.tick || fmt)(v), { anchor: "end", baseline: "middle" }); }).join("");
  labels.forEach((lb, i) => {
    const v = values[i], bh = v / max * ih, x = L + i * bw + bw * .18, y = T + ih - bh, bwid = bw * .64;
    const col = (o.colors && o.colors[i]) || "var(--s1)";
    s += `<path d="M${x},${T + ih} V${y + 4} q0,-4 4,-4 h${bwid - 8} q4,0 4,4 V${T + ih} Z" style="fill:${col}" data-tip="${esc(o.tip ? o.tip(i) : `${lb}<br><b>${(o.val || fmt)(v)}<\/b>`)}"/>`;
    if (o.labels !== false) s += txt(x + bwid / 2, y - 6, (o.val || fmt)(v), { anchor: "middle", fill: "var(--ink-2)", weight: 600 });
    if (!o.every || i % o.every === 0) s += txt(x + bwid / 2, T + ih + 18, lb, { anchor: "middle" });
  });
  el.innerHTML = svg(w, h, s);
}

function barH(el, labels, values, o = {}) {
  const w = W(el), rowH = o.rowH || 24, L = o.left || 120, R = o.right || 54, T = 6, B = 26;
  const h = T + B + labels.length * rowH, max = o.max || niceMax(Math.max(...values) * 1.05), iw = w - L - R;
  let s = ticks(max, 4).map(v => { const x = L + v / max * iw; return `<line x1="${x}" x2="${x}" y1="${T}" y2="${h - B}" style="stroke:var(--rule)"/>` + txt(x, h - 8, (o.tick || fmt)(v), { anchor: "middle" }); }).join("");
  labels.forEach((lb, i) => {
    const v = values[i], bwid = Math.max(1, v / max * iw), y = T + i * rowH + rowH * .18, bh = rowH * .64;
    const col = (o.colors && o.colors[i]) || "var(--s1)";
    s += txt(L - 8, y + bh / 2, lb, { anchor: "end", baseline: "middle", fill: "var(--ink-2)" });
    s += `<path d="M${L},${y} h${bwid - 4} q4,0 4,4 v${bh - 8} q0,4 -4,4 h${-(bwid - 4)} Z" style="fill:${col}" data-tip="${esc(o.tip ? o.tip(i) : `${lb}<br><b>${(o.val || fmt)(v)}<\/b>`)}"/>`;
    if (o.labels !== false) s += txt(L + bwid + 6, y + bh / 2, (o.val || fmt)(v), { baseline: "middle", fill: "var(--ink-2)" });
  });
  if (o.ref != null) { const x = L + o.ref / max * iw; s += `<line x1="${x}" x2="${x}" y1="${T - 2}" y2="${h - B}" style="stroke:var(--ink-3);stroke-dasharray:4 4"/>` + txt(x + 4, T + 8, o.refLabel || "", { size: 11 }); }
  el.innerHTML = svg(w, h, s);
}

function stackH(el, labels, series, o = {}) {
  const w = W(el), rowH = 28, L = o.left || 110, R = 16, T = 6, B = 26, h = T + B + labels.length * rowH;
  const tot = labels.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const max = niceMax(Math.max(...tot) * 1.05), iw = w - L - R;
  let s = ticks(max, 4).map(v => { const x = L + v / max * iw; return `<line x1="${x}" x2="${x}" y1="${T}" y2="${h - B}" style="stroke:var(--rule)"/>` + txt(x, h - 8, v.toFixed(3), { anchor: "middle" }); }).join("");
  labels.forEach((lb, i) => {
    let x = L; const y = T + i * rowH + rowH * .18, bh = rowH * .64;
    s += txt(L - 8, y + bh / 2, lb, { anchor: "end", baseline: "middle", fill: "var(--ink-2)", weight: i === 0 ? 700 : 400 });
    series.forEach((se, k) => {
      const bw = se.values[i] / max * iw;
      s += `<rect x="${x}" y="${y}" width="${Math.max(0, bw - (k < series.length - 1 ? 2 : 0))}" height="${bh}" rx="${k === series.length - 1 ? 4 : 0}" style="fill:${se.color}" data-tip="${esc(se.tip(i))}"/>`;
      x += bw;
    });
  });
  el.innerHTML = svg(w, h, s);
}

function lines(el, xs, series, o = {}) {
  const w = W(el), h = o.h || 280, L = 40, R = 14, T = 12, B = 34, iw = w - L - R, ih = h - T - B;
  const max = o.max || niceMax(Math.max(...series.flatMap(s => s.values))), xmin = xs[0], xmax = xs[xs.length - 1];
  const X = v => L + (v - xmin) / (xmax - xmin) * iw, Y = v => T + ih - v / max * ih;
  let s = ticks(max).map(v => `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--rule)"/>` + txt(L - 6, Y(v), (o.tick || fmt)(v), { anchor: "end", baseline: "middle" })).join("");
  xs.forEach((x, i) => { if (i % (o.every || 5) === 0 || i === xs.length - 1) s += txt(X(x), h - 12, x, { anchor: "middle" }); });
  if (o.xlabel) s += txt(L + iw / 2, h, o.xlabel, { anchor: "middle", size: 11 });
  series.forEach(se => {
    s += `<path d="${se.values.map((v, i) => `${i ? "L" : "M"}${X(xs[i])},${Y(v)}`).join("")}" style="fill:none;stroke:${se.color};stroke-width:2;${se.dash ? "stroke-dasharray:5 4" : ""}"/>`;
    if (se.dots) se.values.forEach((v, i) => { s += `<circle cx="${X(xs[i])}" cy="${Y(v)}" r="3.5" style="fill:${se.color};stroke:var(--surface);stroke-width:1.5"/>`; });
  });
  const colw = iw / (xs.length - 1);
  xs.forEach((x, i) => { s += `<rect x="${X(x) - colw / 2}" y="${T}" width="${colw}" height="${ih}" style="fill:transparent" data-tip="${esc(o.tip(i))}"/>`; });
  el.innerHTML = svg(w, h, s);
}

function mixHex(a, b, t) {
  const p = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const A = p(a), B2 = p(b); return "rgb(" + A.map((v, i) => Math.round(v + (B2[i] - v) * t)).join(",") + ")";
}
function ramp(stops, t) { t = Math.max(0, Math.min(1, t)); const n = stops.length - 1, i = Math.min(n - 1, Math.floor(t * n)); return mixHex(stops[i], stops[i + 1], t * n - i); }

function heatmap(el, rows, cols, M, o) {
  const w = W(el), L = 92, T = 8, B = 86, R = 8, cw = (w - L - R) / cols.length, ch = Math.min(28, Math.max(20, cw * .8)), h = T + B + rows.length * ch;
  const seq = ["--heat-0", "--heat-1", "--heat-2", "--heat-3", "--heat-4"].map(cssv);
  const div = [cssv("--div-lo"), cssv("--div-mid"), cssv("--div-hi")];
  let s = "";
  rows.forEach((r, i) => {
    s += txt(L - 6, T + i * ch + ch / 2, r, { anchor: "end", baseline: "middle", fill: "var(--ink-2)" });
    cols.forEach((c, j) => {
      const v = M[i][j], col = o.diverging ? ramp(div, (v - o.min) / (o.max - o.min)) : ramp(seq, (v - o.min) / (o.max - o.min));
      s += `<rect x="${L + j * cw + 1}" y="${T + i * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" style="fill:${col}" data-tip="${esc(o.tip(i, j))}"/>`;
    });
  });
  cols.forEach((c, j) => { const x = L + j * cw + cw / 2, y = T + rows.length * ch + 8; s += `<text transform="translate(${x},${y}) rotate(-45)" text-anchor="end" style="fill:var(--ink-2);font:400 11.5px var(--body)">${esc(c)}<\/text>`; });
  s += txt(L + (w - L - R) / 2, h - 4, "next category (B) →", { anchor: "middle", size: 11 });
  el.innerHTML = svg(w, h, s);
}

function scatter(el, pts, o) {
  const w = W(el), h = 300, L = 54, R = 16, T = 12, B = 38, iw = w - L - R, ih = h - T - B;
  const X = v => L + (v - o.xmin) / (o.xmax - o.xmin) * iw, Y = v => T + ih - (v - o.ymin) / (o.ymax - o.ymin) * ih;
  let s = "";
  for (let v = o.ymin; v <= o.ymax + 1e-9; v += o.ystep) s += `<line x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--rule)"/>` + txt(L - 6, Y(v), v.toFixed(2), { anchor: "end", baseline: "middle" });
  for (let v = o.xmin; v <= o.xmax + 1e-9; v += o.xstep) s += txt(X(v), h - 18, fmt(v), { anchor: "middle" });
  s += txt(L + iw / 2, h - 2, o.xlabel, { anchor: "middle", size: 11 });
  pts.forEach(p => { s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" style="fill:var(--s1);stroke:var(--surface);stroke-width:2" data-tip="${esc(p.tip)}"/>`; });
  el.innerHTML = svg(w, h, s);
}

function journeyPlot(el, j) {
  const cats = [...new Set(j.map(x => x.category))].sort();
  const w = W(el), L = 96, R = 12, T = 10, rowH = 20, B = 34, h = T + B + cats.length * rowH, iw = w - L - R;
  const X = k => L + (k - 1) / Math.max(1, j.length - 1) * iw, Y = c => T + cats.indexOf(c) * rowH + rowH / 2;
  let s = cats.map(c => `<line x1="${L}" x2="${w - R}" y1="${Y(c)}" y2="${Y(c)}" style="stroke:var(--rule)"/>` + txt(L - 8, Y(c), c, { anchor: "end", baseline: "middle", fill: "var(--ink-2)" })).join("");
  s += `<path d="${j.map((x, i) => `${i ? "L" : "M"}${X(x.rental_number)},${Y(x.category)}`).join("")}" style="fill:none;stroke:var(--rule-strong);stroke-width:1.5"/>`;
  const col = { switch: "var(--s1)", repeat: "var(--s2)", "first rental": "var(--s-gray)" };
  j.forEach(x => { s += `<circle cx="${X(x.rental_number)}" cy="${Y(x.category)}" r="5.5" style="fill:${col[x.transition]};stroke:var(--surface);stroke-width:2" data-tip="${esc(`#${x.rental_number} · <b>${x.category}<\/b> (${x.transition})<br>${title(x.title)}<br>${x.rental_date}`)}"/>`; });
  for (let k = 1; k <= j.length; k += (j.length > 30 ? 5 : 4)) s += txt(X(k), h - 14, k, { anchor: "middle" });
  s += txt(L + iw / 2, h, "rental number", { anchor: "middle", size: 11 });

/* ------------------------------------------------------------------ helpers */
const note = (html, kind = "") => `<div class="note ${kind}">${kind === "caution" ? '<b class="tag">Caution<\/b>' : kind === "" ? '<b class="tag">Finding<\/b>' : ""}${html}<\/div>`;
const kpi = (l, v, s = "") => `<div class="kpi"><div class="l">${l}<\/div><div class="v">${v}<\/div><div class="s">${s}<\/div><\/div>`;
const chipsHTML = (cs, max = 10) => { const it = cs.slice(-max); return `<div class="chips">${cs.length > max ? '<span class="chip">…<\/span><span class="arr">→<\/span>' : ""}${it.map((c, i) => `<span class="chip ${i === it.length - 1 ? "last" : ""}">${esc(c)}<\/span>`).join('<span class="arr">→<\/span>')}<\/div>`; };
const table = (cols, rows) => `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${c.h}<\/th>`).join("")}<\/tr><\/thead><tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.f ? c.f(r) : esc(r[c.k])}<\/td>`).join("")}<\/tr>`).join("")}<\/tbody><\/table><\/div>`;
const seg = (id, opts, cur) => `<div class="seg" id="${id}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}<\/button>`).join("")}<\/div>`;
const customerOptions = sel => Object.keys(D.customers).map(id => `<option value="${id}" ${+id === +sel ? "selected" : ""}>${id} · ${esc(D.customers[id].n)}<\/option>`).join("");
const H = D.headline, IT = D.independence, RP = D.repetition, DV = D.diversity, RS = D.return;
const draws = []; // re-render hooks for resize / theme

/* ------------------------------------------------------------------ pages */
const PAGES = {};

  <p class="lede">A business-intelligence study of Sakila's 599 customers. Every figure on these pages comes from SQL and Python run on the official Sakila data.<\/p><\/div>

    ${kpi("Total revenue", money(H.total_revenue), "sum of payments in window")}
    ${kpi("Avg rental rate", money(H.avg_catalog_rental_rate), `catalogue avg · ${money(H.avg_payment_per_rental)} paid per rental`)}
    ${kpi("Most rented category", H.most_rented_category, `${fmt(H.most_rented_category_rentals)} rentals`)}

  <div class="story">
    <a href="#exploration"><span class="n">Step 1<\/span><span class="q">Do customers return?<\/span><span class="a">Yes: ${RS.pct_customers_returning}% rent more than once.<\/span><\/a>
    <a href="#exploration"><span class="n">Step 2<\/span><span class="q">Do they repeat a category?<\/span><span class="a">Rarely: ${RP.switch_pct}% of next rentals switch.<\/span><\/a>
    <a href="#transitions"><span class="n">Step 3<\/span><span class="q">Where do they go next?<\/span><span class="a">Almost anywhere: χ² p = ${IT.p_value.toFixed(2)}.<\/span><\/a>
    <a href="#recommend"><span class="n">Step 4<\/span><span class="q">What should we recommend?<\/span><span class="a">A transparent, data-based suggestion.<\/span><\/a>
    <a href="#agent"><span class="n">Step 5<\/span><span class="q">Explain it<\/span><span class="a">An AI agent that answers from the data.<\/span><\/a>

  <div class="grid2">
    <div class="panel"><h3>Rentals per month<\/h3><div class="chart" id="c-mr"><\/div><\/div>
    <div class="panel"><h3>Revenue per month<\/h3><div class="sub">Payments dated inside the analysis window<\/div><div class="chart" id="c-mv"><\/div><\/div>
  <\/div>
  ${note(`Activity peaks in <b>${peak.month}<\/b> (${fmt(peak.rentals)} rentals). Rentals fall on only <b>${RS.distinct_rental_dates_in_window} distinct dates<\/b>, so Sakila records rentals in bursts rather than as a continuous daily stream. Read month-to-month trends with that in mind.`, "neutral")}
  <div class="panel"><h3>Daily rentals<\/h3><div class="sub">Only dates with recorded rentals appear<\/div><div class="chart" id="c-daily"><\/div><\/div>
  <div class="grid2">
    <div class="panel"><h3>Rentals by category<\/h3><div class="sub">Dashed line = a perfectly equal split<\/div><div class="chart" id="c-cat"><\/div><\/div>
    <div style="display:flex;flex-direction:column;gap:14px">

      ${table([{ h: "Category", k: "category" }, { h: "Rentals", num: 1, f: r => fmt(r.rentals) }, { h: "Share", num: 1, f: r => r.rental_share_pct.toFixed(2) + "%" }, { h: "Revenue", num: 1, f: r => money(r.revenue) }], cp)}

  <div class="kpis">

  ${note(`All ${RS.customers_with_rentals} customers return, and even the lightest customer has ${RS.rentals_per_customer_min} rentals. Retention is not the issue for Sakila. The real question is <b>what customers choose when they come back<\/b>.`)}

    ${kpi("Categories explored", `${DV.median_distinct_categories} / ${DV.total_categories}`, "median per customer")}

  ${note(`But the repeat rate (${RP.repeat_pct}%) is close to what pure chance would produce. Picking categories at random gives ${RP.random_choice_repeat_pct}%, and shuffling each customer's own history gives ${RP.shuffled_sequence_repeat_pct}% (p = ${RP.shuffled_repeat_p_value}, ${RP.n_permutations} shuffles). So switching is simply what happens when customers choose among 16 categories with similar demand. It is not evidence of a special appetite for novelty. The result holds when only rentals on different days are counted (${RP.different_day_repeat_pct}% repeats).`, "caution")}

    <div class="legend"><span><i style="background:var(--s1)"><\/i>Observed<\/span><span><i class="dash"><\/i>Shuffled baseline<\/span><\/div><div class="chart" id="c-disc"><\/div><\/div>
  ${(() => { const d = D.discovery; const a = d.find(r => r.rental_number === 2), b = d.find(r => r.rental_number === 10);
    return note(`At rental #2, ${a.observed_new_category_pct.toFixed(1)}% of customers choose a category they haven't tried before. By rental #10 the figure is still ${b.observed_new_category_pct.toFixed(1)}%. It falls only because customers run out of untried categories: the observed curve closely follows the shuffled baseline.`, "neutral"); })()}
  <h2>Customer journey examples<\/h2>

draws.push(["exploration", () => {
  barV($("#c-rep"), ["Observed in Sakila", "Shuffled own history", "Random choice (Σp²)"], [RP.repeat_pct, RP.shuffled_sequence_repeat_pct, RP.random_choice_repeat_pct],

  barV($("#c-div"), dist.map(x => x[0]), dist.map(x => x[1]), { tip: i => `${dist[i][0]} categories<br><b>${dist[i][1]}<\/b> customers` });

function renderJourney() {
  const cid = state.journeyCustomer, j = E.journey(cid), s = D.summary[cid];
  $("#jview").innerHTML = `${chipsHTML(j.map(x => x.category), 12)}
    <p class="lede" style="margin-top:8px;font-size:13.5px">${esc(D.customers[cid].n)} · ${esc(D.customers[cid].loc)} · ${j.length} rentals · ${s[0]} categories · repeat rate ${(100 * s[1]).toFixed(1)}% · favourite: ${s[2]} (${(100 * s[3]).toFixed(0)}%)<\/p>
    <div class="panel"><div class="legend"><span><i style="background:var(--s1)"><\/i>switch<\/span><span><i style="background:var(--s2)"><\/i>repeat<\/span><span><i style="background:var(--s-gray)"><\/i>first rental<\/span><\/div><div class="chart" id="c-journey"><\/div>
    <div class="sub">Rentals with the same timestamp are ordered by rental_id (a fixed tie-breaker).<\/div><\/div>`;
